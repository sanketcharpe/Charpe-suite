# Builds the Charpe Suite Android app (APK) whenever the android/ folder changes,
# and publishes it at a fixed address:
#   https://github.com/sanketcharpe/Charpe-suite/releases/latest/download/CharpeSuite.apk
#   https://github.com/sanketcharpe/Charpe-suite/releases/latest/download/ExcerptDesk.apk  (the same app;
#   it puts two icons on the phone, Charpe Suite and Excerpt Desk, sharing one set of data)
# Can also be started by hand: Actions > Build Android app > Run workflow.
name: Build Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Name it
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk CharpeSuite.apk
          cp CharpeSuite.apk ExcerptDesk.apk

      - name: Publish it
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Charpe Suite app — build ${{ github.run_number }}
          body: |
            Install on the phone: open this page on the phone, tap CharpeSuite.apk, then Install.
            A new build installs over the old one and keeps everything on the phone.
            CharpeSuite.apk and ExcerptDesk.apk are the same app: either one gives two icons, Charpe Suite and Excerpt Desk.
          files: |
            CharpeSuite.apk
            ExcerptDesk.apk
          make_latest: true

      # Also on the site itself (sanketcharpe.github.io), which every phone network reaches;
      # GitHub's release file server is blocked or very slow on some mobile networks.
      - name: Put it on the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app
          cp CharpeSuite.apk app/CharpeSuite.apk
          cp CharpeSuite.apk app/ExcerptDesk.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -f app/CharpeSuite.apk app/ExcerptDesk.apk
          git commit -m "Android app build ${{ github.run_number }} on the site" || exit 0
          git pull --rebase -q && git push
          gh api -X POST repos/${{ github.repository }}/pages/builds || true
