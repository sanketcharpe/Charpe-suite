# Builds the Charpe Suite Android app (APK) whenever the android/ folder changes,
# and publishes it at a fixed address:
#   https://github.com/sanketcharpe/Charpe-suite/releases/latest/download/CharpeSuite.apk
# Can also be started by hand: Actions > Build Android app > Run workflow.
name: Build Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Name it
        run: cp android/app/build/outputs/apk/release/app-release.apk CharpeSuite.apk

      - name: Publish it
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Charpe Suite app — build ${{ github.run_number }}
          body: |
            Install on the phone: open this page on the phone, tap CharpeSuite.apk, then Install.
            A new build installs over the old one and keeps everything on the phone.
          files: CharpeSuite.apk
          make_latest: true
